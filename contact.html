<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Azure Yachts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Azure Yachts</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listings.html">Yachts</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section>
    <div class="container">
      <h2 class="section-title">Enquire</h2>
      <p class="section-sub">Tell us which yacht you're interested in and we'll be in touch.</p>

      <form class="form" id="enquiry-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-navy">Send enquiry</button>
        <p class="form-note" id="form-note"></p>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">Azure Yachts &middot; Placeholder site &middot; Monaco</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
