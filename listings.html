<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Yachts — Azure Yachts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Azure Yachts</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listings.html">Yachts</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section>
    <div class="container">
      <h2 class="section-title">The fleet</h2>
      <p class="section-sub">Filter by availability and price to find your yacht.</p>

      <div class="filters">
        <div class="field">
          <label for="filter-type">Buy or charter</label>
          <select id="filter-type">
            <option value="all">All</option>
            <option value="buy">For sale</option>
            <option value="rent">For charter</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-price">Price</label>
          <select id="filter-price">
            <option value="any">Any price</option>
            <option value="u10k">Under $10,000</option>
            <option value="10k-100k">$10,000 – $100,000</option>
            <option value="100k-2m">$100,000 – $2M</option>
            <option value="o2m">Over $2M</option>
          </select>
        </div>
      </div>

      <p class="count" id="listings-count"></p>
      <div class="grid" id="listings-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">Azure Yachts &middot; Placeholder site &middot; Monaco</div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
